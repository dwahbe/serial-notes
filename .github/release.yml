# Shapes the notes produced by `gh release create --generate-notes`.
# Pull requests are grouped by label; everything else lands in "Other Changes".
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  categories:
    - title: ✨ Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Fixes
      labels:
        - bug
        - fix
    - title: 🧹 Maintenance
      labels:
        - chore
        - refactor
        - docs
        - dependencies
    - title: Other Changes
      labels:
        - "*"
