name: Release

# Push a version tag (e.g. v0.2.0) to cut a release. This builds, Developer-ID
# signs, notarizes, and staples the app, publishes a GitHub Release with the
# zip, then signs the update for Sparkle and commits the regenerated appcast to
# main — so installed users get prompted to update.
#
# `scripts/release.sh X.Y.Z` is the convenience trigger (it just tags + pushes).
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   BUILD_CERTIFICATE_BASE64      base64 of the Developer ID Application .p12
#   P12_PASSWORD                  password set when exporting that .p12
#   KEYCHAIN_PASSWORD             any string — locks the ephemeral CI keychain
#   NOTARY_API_KEY_BASE64         base64 of the App Store Connect AuthKey .p8
#   NOTARY_KEY_ID                 the .p8 Key ID
#   NOTARY_ISSUER_ID              the App Store Connect Issuer ID
#   SPARKLE_ED_PRIVATE_KEY_BASE64 base64 of the EdDSA key from `generate_keys -x`

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the Release + push the appcast commit to main

# Serialize release jobs so two tags pushed close together can't race on the
# appcast commit to main. cancel-in-progress: false lets the second one queue
# rather than getting cancelled mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout (full history for build number)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          CERT="$RUNNER_TEMP/cert.p12"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Add our keychain to the search list so codesign / find-identity see it.
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT"

      - name: Build, sign, notarize, staple
        env:
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"

          # Auto-detect the imported Developer ID identity (same as release.sh).
          SIGN_IDENTITY="$(security find-identity -v -p codesigning \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          [ -n "$SIGN_IDENTITY" ] || { echo "no Developer ID identity in keychain" >&2; exit 1; }
          export SIGN_IDENTITY
          echo "Signing as: $SIGN_IDENTITY"

          MARKETING_VERSION="$VERSION" ./scripts/build-app.sh release

          APP=.build/SerialNotes.app
          # Stable asset name (no version) so the site can link to a fixed
          # /releases/latest/download/SerialNotes.zip. The per-tag path keeps each
          # release's URL unique for Sparkle's appcast.
          ZIP="SerialNotes.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"

          # Notarize with the App Store Connect API key.
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_API_KEY_BASE64" | base64 --decode > "$KEY"
          xcrun notarytool submit "$ZIP" \
            --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          rm -f "$KEY"

          # Staple the ticket, then re-zip (the ticket attaches to the .app).
          xcrun stapler staple "$APP"
          rm -f "$ZIP"
          ditto -c -k --keepParent "$APP" "$ZIP"

          # Gatekeeper sanity check.
          spctl -a -vvv -t execute "$APP"

          {
            echo "ZIP=$ZIP"
            echo "BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          # Beta (0.x) ships as a FULL release — not a hidden GitHub pre-release —
          # so /releases/latest (and the site download link) always resolve. Beta
          # is signaled by the "(beta)" title, the 0.x version, and the in-app label.
          TITLE="$GITHUB_REF_NAME"
          if [ "${VERSION%%.*}" -lt 1 ]; then TITLE="$GITHUB_REF_NAME (beta)"; fi
          # Idempotent: if a prior run already created this release (e.g. a re-run
          # after the appcast step failed), refresh the asset instead of aborting
          # on "release already exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists — updating asset"
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --title "$TITLE" --generate-notes
          fi

      - name: Sign update + commit appcast to main
        env:
          SPARKLE_ED_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          BIN=.build/artifacts/sparkle/Sparkle/bin

          # Run the TAG's appcast script, not main's: copy it aside before we
          # swap the working tree to main below. Otherwise a tag whose commit
          # isn't on main yet (e.g. the first release, or a branch/hotfix tag)
          # would lose the script when we check out main.
          cp scripts/update_appcast.py "$RUNNER_TEMP/update_appcast.py"

          KEYFILE="$RUNNER_TEMP/sparkle_ed_key"
          echo "$SPARKLE_ED_PRIVATE_KEY_BASE64" | base64 --decode > "$KEYFILE"
          SIG="$("$BIN/sign_update" --ed-key-file "$KEYFILE" "$ZIP")"
          rm -f "$KEYFILE"

          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP}"
          NOTES="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The appcast lives on main. Regenerate it against the LATEST main and
          # push, retrying if main advanced under us (a concurrent release or a
          # merge landing between fetch and push). It MUST land — otherwise the
          # release ships but installed users never get the update — so
          # exhausting the retries is a hard failure. Each attempt re-fetches and
          # re-applies our item on top of the newest main, so a competing item is
          # preserved rather than clobbered.
          pushed=""
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -f -B main origin/main
            python3 "$RUNNER_TEMP/update_appcast.py" \
              --appcast appcast.xml \
              --title "Version $VERSION" \
              --version "$BUILD_NUMBER" \
              --short-version "$VERSION" \
              --min-system "26.0" \
              --url "$URL" \
              --signature "$SIG" \
              --release-notes-link "$NOTES"
            git add appcast.xml
            if git diff --cached --quiet; then
              echo "appcast already current"; pushed=1; break
            fi
            git commit -m "Update appcast for $GITHUB_REF_NAME"
            if git push origin main; then pushed=1; break; fi
            echo "main advanced; re-fetching and retrying ($attempt)…"
            sleep "$((attempt * 3))"
          done
          [ -n "$pushed" ] || { echo "ERROR: could not push appcast after retries" >&2; exit 1; }
