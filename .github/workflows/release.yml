name: Release

# Push a version tag (e.g. v0.2.0) to cut a release. This builds, Developer-ID
# signs, notarizes, and staples the app, publishes a GitHub Release with the
# zip, then signs the update for Sparkle and commits the regenerated appcast to
# main — so installed users get prompted to update.
#
# `scripts/release.sh X.Y.Z` is the convenience trigger (it just tags + pushes).
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   BUILD_CERTIFICATE_BASE64      base64 of the Developer ID Application .p12
#   P12_PASSWORD                  password set when exporting that .p12
#   KEYCHAIN_PASSWORD             any string — locks the ephemeral CI keychain
#   NOTARY_API_KEY_BASE64         base64 of the App Store Connect AuthKey .p8
#   NOTARY_KEY_ID                 the .p8 Key ID
#   NOTARY_ISSUER_ID              the App Store Connect Issuer ID
#   SPARKLE_ED_PRIVATE_KEY_BASE64 base64 of the EdDSA key from `generate_keys -x`

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the Release + push the appcast commit to main

# Serialize release jobs so two tags pushed close together can't race on the
# appcast commit to main. cancel-in-progress: false lets the second one queue
# rather than getting cancelled mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout (full history for build number)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          CERT="$RUNNER_TEMP/cert.p12"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Add our keychain to the search list so codesign / find-identity see it.
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT"

      - name: Build, sign, notarize, staple
        env:
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"

          # Auto-detect the imported Developer ID identity (same as release.sh).
          SIGN_IDENTITY="$(security find-identity -v -p codesigning \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          [ -n "$SIGN_IDENTITY" ] || { echo "no Developer ID identity in keychain" >&2; exit 1; }
          export SIGN_IDENTITY
          echo "Signing as: $SIGN_IDENTITY"

          MARKETING_VERSION="$VERSION" ./scripts/build-app.sh release

          APP=.build/SerialNotes.app
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_API_KEY_BASE64" | base64 --decode > "$KEY"

          # Notarize the app via a throwaway zip (notarytool needs an archive),
          # then staple the ticket onto the .app so it launches offline.
          APP_ZIP="$RUNNER_TEMP/app.zip"
          ditto -c -k --keepParent "$APP" "$APP_ZIP"
          xcrun notarytool submit "$APP_ZIP" \
            --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$APP"

          # Wrap the stapled app in a styled drag-to-Applications DMG. Stable asset
          # name (no version) so the site can link to a fixed
          # /releases/latest/download/SerialNotes.dmg; the per-tag path keeps each
          # release's URL unique for Sparkle's appcast.
          DMG="SerialNotes.dmg"
          ./scripts/make-dmg.sh "$APP" "$DMG" "Serial Notes"

          # Notarize + staple the DMG itself (Gatekeeper checks the downloaded image).
          xcrun notarytool submit "$DMG" \
            --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$DMG"
          rm -f "$KEY"

          # Export results for the downstream steps FIRST — before any best-effort
          # assessment — so a finicky check can't abort the release after notarization
          # + stapling already succeeded.
          {
            echo "DMG=$DMG"
            echo "BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"
          } >> "$GITHUB_ENV"

          # Gatekeeper sanity checks (advisory — notarytool --wait + stapler already
          # guarantee validity). `spctl -t open` on a DMG returns non-zero even for a
          # valid notarized image (wrong assessment context), so validate the stapled
          # ticket instead — that's the meaningful signal.
          spctl -a -vvv -t execute "$APP" || echo "WARN: app spctl assessment returned non-zero"
          xcrun stapler validate "$DMG" || echo "WARN: stapler validate returned non-zero"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          # Beta (0.x) ships as a FULL release — not a hidden GitHub pre-release —
          # so /releases/latest (and the site download link) always resolve. Beta
          # is signaled by the "(beta)" title, the 0.x version, and the in-app label.
          TITLE="$GITHUB_REF_NAME"
          if [ "${VERSION%%.*}" -lt 1 ]; then TITLE="$GITHUB_REF_NAME (beta)"; fi
          # Idempotent: if a prior run already created this release (e.g. a re-run
          # after the appcast step failed), refresh the asset instead of aborting
          # on "release already exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists — updating asset"
            gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$DMG" \
              --title "$TITLE" --generate-notes
          fi

      - name: Sign update + commit appcast to main
        env:
          SPARKLE_ED_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED_PRIVATE_KEY_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          BIN=.build/artifacts/sparkle/Sparkle/bin

          # Run the TAG's appcast script, not main's: copy it aside before we
          # swap the working tree to main below. Otherwise a tag whose commit
          # isn't on main yet (e.g. the first release, or a branch/hotfix tag)
          # would lose the script when we check out main.
          cp scripts/update_appcast.py "$RUNNER_TEMP/update_appcast.py"

          KEYFILE="$RUNNER_TEMP/sparkle_ed_key"
          echo "$SPARKLE_ED_PRIVATE_KEY_BASE64" | base64 --decode > "$KEYFILE"
          SIG="$("$BIN/sign_update" --ed-key-file "$KEYFILE" "$DMG")"
          rm -f "$KEYFILE"

          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${DMG}"
          NOTES="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"

          # Render the release's GitHub-generated notes into self-contained HTML and
          # embed it in the appcast's <description>, so Sparkle's "What's New" pane
          # shows the actual changes instead of loading the GitHub release page
          # (which drags in the whole repo nav chrome). GitHub's /markdown endpoint
          # gives accurate GFM with working PR/issue links; we just add a little CSS.
          NOTES_HTML="$RUNNER_TEMP/release-notes.html"
          NOTES_BODY="$RUNNER_TEMP/release-notes-body.html"
          : > "$NOTES_BODY"
          NOTES_MD="$(gh release view "$GITHUB_REF_NAME" --json body -q .body || true)"
          if [ -n "$NOTES_MD" ]; then
            gh api --method POST /markdown \
              -f mode=gfm -f context="$GITHUB_REPOSITORY" -f text="$NOTES_MD" \
              > "$NOTES_BODY" || : > "$NOTES_BODY"
          fi
          {
            cat <<'CSS'
          <style>
            :root { color-scheme: light dark; }
            body { font: 13px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: #1d1d1f; margin: 0; padding: 2px 4px; }
            h1, h2, h3 { font-weight: 600; margin: 1em 0 0.4em; line-height: 1.25; }
            h1 { font-size: 1.25em; } h2 { font-size: 1.1em; } h3 { font-size: 1em; }
            ul, ol { padding-left: 1.4em; margin: 0.4em 0; }
            li { margin: 0.2em 0; }
            a { color: #0066cc; text-decoration: none; }
            code { font-family: "SF Mono", ui-monospace, monospace; font-size: 0.92em; background: rgba(127,127,127,0.15); padding: 0.1em 0.3em; border-radius: 4px; }
            @media (prefers-color-scheme: dark) { body { color: #e8e8ed; } a { color: #6cb4ff; } }
          </style>
          CSS
            cat "$NOTES_BODY"
          } > "$NOTES_HTML"

          # Only attach the embedded notes when the render produced real content;
          # otherwise pass nothing so update_appcast.py falls back to the release-page
          # link rather than a What's-New pane containing only CSS.
          if [ -s "$NOTES_BODY" ]; then NOTES_FILE_ARG="$NOTES_HTML"; else NOTES_FILE_ARG=""; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The appcast lives on main. Regenerate it against the LATEST main and
          # push, retrying if main advanced under us (a concurrent release or a
          # merge landing between fetch and push). It MUST land — otherwise the
          # release ships but installed users never get the update — so
          # exhausting the retries is a hard failure. Each attempt re-fetches and
          # re-applies our item on top of the newest main, so a competing item is
          # preserved rather than clobbered.
          pushed=""
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -f -B main origin/main
            python3 "$RUNNER_TEMP/update_appcast.py" \
              --appcast appcast.xml \
              --title "Version $VERSION" \
              --version "$BUILD_NUMBER" \
              --short-version "$VERSION" \
              --min-system "26.0" \
              --url "$URL" \
              --signature "$SIG" \
              --release-notes-link "$NOTES" \
              --release-notes-file "$NOTES_FILE_ARG"
            git add appcast.xml
            if git diff --cached --quiet; then
              echo "appcast already current"; pushed=1; break
            fi
            git commit -m "Update appcast for $GITHUB_REF_NAME"
            if git push origin main; then pushed=1; break; fi
            echo "main advanced; re-fetching and retrying ($attempt)…"
            sleep "$((attempt * 3))"
          done
          [ -n "$pushed" ] || { echo "ERROR: could not push appcast after retries" >&2; exit 1; }
