<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Serial Notes app icon master (1024×1024) — FULL-BLEED for macOS 26 (Tahoe).

    The dark tile fills the entire canvas: no margin, no self-applied corner
    rounding, no baked drop shadow. macOS 26 composites every app icon into its
    own rounded "tile" and adds the shadow, so the old approach — a smaller
    squircle floated inside a transparent margin — left that margin for the system
    tile to fill with white, which read as a stray border around the mark. Letting
    the art bleed to the edges removes it; the system applies the rounded mask.

    The glyph is the site brand mark (site/public/favicon.svg) — a waveform inside
    a circle — reused verbatim via a transform that scales the favicon's 32-unit
    space into the canvas, so the app icon and the favicon stay coordinate-faithful.

    Regenerate the .icns from this file with ./icon/make-icon.sh.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1e" />
      <stop offset="1" stop-color="#0a0a0a" />
    </linearGradient>
  </defs>

  <!-- Full-bleed brand tile; macOS applies the rounded mask + drop shadow. The
       small rx (≈17.6%, deliberately tighter than Apple's ~22% mask) is only a
       fallback shape: when the system masks, our squarer corners sit fully under
       its rounder mask (so no transparent gap shows as white); if it ever doesn't,
       the icon still reads as rounded rather than a sharp square. -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="url(#tile)" />

  <!-- Menu-bar glyph, reusing favicon.svg coords scaled into the canvas.
       scale = 824/32 = 25.75, translated by 100 → the mark stays centered at
       (512,512) at its established size, now with comfortable padding to the
       full-bleed (later rounded) edges. -->
  <g transform="translate(100,100) scale(25.75)">
    <circle cx="16" cy="16" r="12" fill="none" stroke="#fff" stroke-width="2.0" />
    <g stroke="#fff" stroke-width="1.6" stroke-linecap="round">
      <line x1="9.5" y1="13.75" x2="9.5" y2="18.25" />
      <line x1="12.1" y1="12" x2="12.1" y2="20" />
      <line x1="14.7" y1="10.75" x2="14.7" y2="21.25" />
      <line x1="17.3" y1="13.5" x2="17.3" y2="18.5" />
      <line x1="19.9" y1="12" x2="19.9" y2="20" />
      <line x1="22.5" y1="14.5" x2="22.5" y2="17.5" />
    </g>
  </g>
</svg>
